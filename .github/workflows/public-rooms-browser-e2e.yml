name: Public rooms browser E2E
on:
  push:
    branches: [feature/public-rooms-cloudflare]
    paths:
      - 'public-rooms-worker/**'
      - 'index.html'
      - '.github/workflows/public-rooms-browser-e2e.yml'
  pull_request:
    paths:
      - 'public-rooms-worker/**'
      - 'index.html'
      - '.github/workflows/public-rooms-browser-e2e.yml'
jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install isolated browser test dependencies
        working-directory: public-rooms-worker
        run: npm install --no-save --no-package-lock playwright@1.56.1 mqtt@5.10.1 wrangler@4.169.0
      - name: Install Chromium
        working-directory: public-rooms-worker
        run: npx playwright install --with-deps chromium
      - name: Start local static game preview
        run: |
          python3 -m http.server 5173 --bind 127.0.0.1 > /tmp/dice-page.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo "Local game preview ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dice-page.log
          exit 1
      - name: Start isolated local Worker (no deployment)
        working-directory: public-rooms-worker
        run: |
          npx wrangler dev --config wrangler.test.toml --port 8787 --ip 127.0.0.1 > /tmp/dice-worker.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8787/health >/dev/null; then
              echo "Local Worker ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dice-worker.log
          exit 1
      - name: Run isolated real-browser two-player test
        working-directory: public-rooms-worker
        run: node e2e/browser-e2e.mjs
