name: Public rooms tests
on:
  push:
    branches: [feature/public-rooms-cloudflare]
    paths:
      - 'public-rooms-worker/**'
      - 'index.html'
      - '.github/workflows/public-rooms-tests.yml'
      - '.github/workflows/worker-api-smoke.yml'
  pull_request:
    paths:
      - 'public-rooms-worker/**'
      - 'index.html'
      - '.github/workflows/public-rooms-tests.yml'
      - '.github/workflows/worker-api-smoke.yml'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate Worker build (dry run)
        run: npx --yes wrangler@4 deploy --dry-run
        working-directory: public-rooms-worker
      - run: npm test
        working-directory: public-rooms-worker
