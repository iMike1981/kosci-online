<script>(function(root){
const CATS=[
 ['u1','Jedynki (1)'],['u2','Dwójki (2)'],['u3','Trójki (3)'],['u4','Czwórki (4)'],['u5','Piątki (5)'],['u6','Szóstki (6)'],
 ['para','Para'],['dpary','Dwie pary'],['tpary','Trzy pary'],['trojka','Trójka'],['dtrojki','Dwie trójki'],
 ['mstrit','Mały strit 1-5'],['dstrit','Duży strit 2-6'],['lstrit','Długi strit 1-6'],['general','Generał'],
 ['full','Full'],['kareta','Kareta'],['poker','Poker (5 jednakowych)'],['lord','Lord (6 jednakowych)'],['szansa','Szansa']];
const UPPER=CATS.slice(0,6).map(c=>c[0]);
function counts(d){const c=[0,0,0,0,0,0,0];d.forEach(v=>c[v]++);return c;}
// best (max) score for each category; null = not possible
function scores(d){
 const c=counts(d),s={},sum=d.reduce((a,b)=>a+b,0);
 for(let n=1;n<=6;n++)s['u'+n]=(c[n]-3)*n;
 const pairs=[],trips=[];
 for(let n=6;n>=1;n--){if(c[n]>=2)pairs.push(n);if(c[n]>=3)trips.push(n);}
 s.para=pairs.length?2*pairs[0]:null;
 // pairs from distinct values; a value with 4+ can count as two pairs
 const pv=[];for(let n=6;n>=1;n--){for(let k=0;k<Math.floor(c[n]/2);k++)pv.push(n);}
 s.dpary=pv.length>=2?2*(pv[0]+pv[1]):null;
 s.tpary=pv.length>=3?2*(pv[0]+pv[1]+pv[2]):null;
 s.trojka=trips.length?3*trips[0]:null;
 const tv=[];for(let n=6;n>=1;n--){for(let k=0;k<Math.floor(c[n]/3);k++)tv.push(n);}
 s.dtrojki=tv.length>=2?3*(tv[0]+tv[1]):null;
 const has=a=>a.every(n=>c[n]>=1);
 s.mstrit=has([1,2,3,4,5])?15:null; s.dstrit=has([2,3,4,5,6])?20:null; s.lstrit=has([1,2,3,4,5,6])?21:null;
 let g=null;for(const m of [2,3,4,5]){const need=[1,2,3,4,5,6].filter(x=>x!==m);if(has(need)){const v=21-m;if(g===null||v>g)g=v;}}
 s.general=g;
 let f=null;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(a!==b&&c[a]>=3&&c[b]>=2){const v=3*a+2*b;if(f===null||v>f)f=v;}
 s.full=f;
 let k=null,p=null,l=null;for(let n=1;n<=6;n++){if(c[n]>=4)k=4*n;if(c[n]>=5)p=5*n+50;if(c[n]>=6)l=2*(5*n+50);}
 s.kareta=k;s.poker=p;s.lord=l;s.szansa=sum;
 return s;
}
function finalScore(cat,d,firstRoll){const v=scores(d)[cat];if(v===null)return null;return firstRoll&&cat!=='szansa'&&v>0?v*2:v;}
function totals(sheet){
 let up=0;UPPER.forEach(k=>{if(typeof sheet[k]==='number')up+=sheet[k];});
 const szkola=up<0?up-50:up;let low=0;
 CATS.slice(6).forEach(([k])=>{if(typeof sheet[k]==='number')low+=sheet[k];});
 return {upper:up,szkola,lower:low,total:szkola+low};
}
// ---- game state machine (authoritative on host) ----
const MAX_EXTRA=3;
function newGame(names){return {phase:'play',players:names.map(n=>({name:n,sheet:{},extraUsed:0})),cur:0,dice:[0,0,0,0,0,0],held:[false,false,false,false,false,false],rolls:0,round:1,log:[]};}
function canRoll(g){const p=g.players[g.cur];return g.phase==='play'&&(g.rolls<3||(g.rolls>=3&&p.extraUsed<MAX_EXTRA));}
function roll(g,rnd){
 if(!canRoll(g))return false;const p=g.players[g.cur];
 if(g.rolls>=3)p.extraUsed++;
 if(g.rolls===0)g.held=[false,false,false,false,false,false];
 g.dice=g.dice.map((v,i)=>g.held[i]&&g.rolls>0?v:1+Math.floor(rnd()*6));g.rolls++;return true;}
function toggleHold(g,i){if(g.rolls>0)g.held[i]=!g.held[i];}
function write(g,cat,cross){
 const p=g.players[g.cur];if(g.rolls===0||cat in p.sheet)return false;
 let v;if(cross)v='x';else{v=finalScore(cat,g.dice,g.rolls===1);if(v===null)return false;}
 p.sheet[cat]=v;g.log.unshift({n:p.name,c:cat,v:v,d:g.rolls===1&&!cross&&cat!=='szansa'&&v>0});g.log=g.log.slice(0,8);
 g.rolls=0;g.held=g.held.map(()=>false);g.cur=(g.cur+1)%g.players.length;
 if(g.cur===0)g.round++;
 if(g.players.every(q=>CATS.every(([k])=>k in q.sheet)))g.phase='end';
 return true;}
const CAT_EN={u1:'Ones (1)',u2:'Twos (2)',u3:'Threes (3)',u4:'Fours (4)',u5:'Fives (5)',u6:'Sixes (6)',para:'1 Pair',dpary:'2 Pairs',tpary:'3 Pairs',trojka:'3 of a kind',dtrojki:'2 x 3 of a kind',mstrit:'Small Straight 1-5',dstrit:'Large Straight 2-6',lstrit:'Long Straight 1-6',general:'General',full:'Full House',kareta:'4 of a kind',poker:'Poker (5 of a kind)',lord:'Lord (6 of a kind)',szansa:'Chance'};
const api={CAT_EN,CATS,UPPER,scores,finalScore,totals,newGame,canRoll,roll,toggleHold,write,MAX_EXTRA};
if(typeof module!=='undefined')module.exports=api;else root.Kosci=api;
})(this);
</script>

 let ok=false;const fail=setTimeout(()=>{if(!ok){cli.end(true);srv++;connect(onUp)}},9000);
 cli.on('connect',()=>{ok=true;clearTimeout(fail);status('🟢 online');const f=onUp;onUp=null;cli.subscribe(topic(),{qos:1},()=>f&&f())});

  if(ci===5)h+='<tr class="tot"><td>'+t('school')+'</td>'+T.map(t=>'<td class="'+(t.szkola<0?'neg':'')+'">'+t.szkola+'</td>').join('')+'</tr>'});
 h+='<tr class="tot"><td>'+t('lower')+'</td>'+T.map(t=>'<td>'+t.lower+'</td>').join('')+'</tr>';
 h+='<tr class="tot"><td>'+t('total')+'</td>'+T.map(t=>'<td class="'+(t.total===best?'lead':'')+'" style="font-size:18px">'+t.total+'</td>').join('')+'</tr>';
 $('tab').innerHTML=h;
 $('tab').querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>send({a:'write',cat:e.dataset.c}));
 $('tab').querySelectorAll('[data-x]').forEach(e=>e.onclick=()=>{if(confirm(t('confirmX')))send({a:'write',cat:e.dataset.x,cross:true})});
 $('log').innerHTML=G.log.map(x=>typeof x==='string'?esc(x):esc(x.n+': '+catName(x.c)+' = '+x.v+(x.d?t('dbl'):''))).join('<br>')}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
applyLang();
</script></body></html>
