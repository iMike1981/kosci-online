.wrap{max-width:1100px;margin:auto;padding:12px}h1{color:#1f3864;margin:6px 0}
.card{background:#ffffffee;border:1px solid #d0dbe8;border-radius:12px;padding:14px;margin:10px 0}

.dice{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}

.roll{animation:sp .6s cubic-bezier(.3,.7,.4,1)}@keyframes sp{0%{transform:rotate(0) scale(.6,.8)}35%{transform:rotate(200deg) scale(1.15,.85)}60%{transform:rotate(330deg) scale(.9,1.12) translateY(-10px)}80%{transform:rotate(360deg) scale(1.08,.9) translateY(0)}90%{transform:translateY(-4px)}100%{transform:none}}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid #d0dbe8;padding:5px 7px;text-align:center}
td:first-child{text-align:left}.up td{background:#eaf1fb}.lo td{background:#eef7ea}th{background:#dde7f5;color:#1f3864}

.lead{background:#ffe699!important}.small{font-size:13px;color:#666}.big{font-size:22px;font-weight:bold;color:#1f3864}

.st-skull{background:radial-gradient(circle at 35% 30%,#fffaf0,#e9dfc3);border-color:#8a7a5a}

.st-ghost{background:radial-gradient(circle,#ffffffee,#e6e9ffcc);border-color:#b8bff0;box-shadow:0 0 12px 3px #c9d0ff}

#rov{position:fixed;inset:0;z-index:70;background:#f6f9fd;overflow-y:auto;-webkit-overflow-scrolling:touch}

.fx-lord2 .ldark{inset:0;background:radial-gradient(ellipse at 50% 0,#2a2040cc,#05030cf0 70%)}
.fx-lord2 .lrays{left:50%;top:-10vh;width:240vmax;height:240vmax;margin-left:-120vmax;background:repeating-conic-gradient(from 0deg at 50% 0%,color-mix(in srgb,var(--lt2) 70%,transparent) 0 3deg,transparent 3deg 9deg);-webkit-mask:radial-gradient(circle at 50% 0,#000,transparent 55%);mask:radial-gradient(circle at 50% 0,#000,transparent 55%);opacity:.75}

.fx-lord2 .lcl{top:-4vh;width:70vw;height:30vh;background:radial-gradient(ellipse at 30% 60%,#fff 0 18%,transparent 40%),radial-gradient(ellipse at 65% 45%,#f3f0ff 0 22%,transparent 45%),radial-gradient(ellipse at 50% 75%,#e8e4f8 0 25%,transparent 50%);filter:blur(2px)}

.fx-lord2 .lshock{left:50%;top:44%;width:20vmin;height:20vmin;margin:-10vmin;border-radius:50%;border:2vmin solid var(--lt2);opacity:0;box-shadow:0 0 40px var(--lt)}

/* animated timeline (~4s), impact at 2.05s */
.fx-lord2.anim .ldark{animation:lfade .5s ease-out both,lout .5s ease-in 3.5s forwards}
.fx-lord2.anim .lrays{animation:lrays 4s ease-out both}
.fx-lord2.anim .lbeam{animation:lbeam 4s ease-out both}

.fx-lord2.anim .ldie{animation:lspin 1.75s ease-out .3s both}
.fx-lord2.anim .lhalo{animation:lhalo 1.4s ease-in-out infinite}
.fx-lord2.anim .lshock{animation:lshock .9s ease-out 2.05s forwards}
.fx-lord2.anim .lflash{animation:lflash .7s ease-out 2.05s forwards}
.fx-lord2.anim .lpart u{animation:lburst 1.4s cubic-bezier(.1,.8,.3,1) calc(2.05s + var(--dl)) forwards}
.fx-lord2.anim .ltxt span{animation:ltxt .6s cubic-bezier(.2,1.6,.4,1) 2.1s both,lshine 1.6s linear 2.4s infinite}

@keyframes lfall{0%{transform:translateY(-50vh) scale(.45);opacity:0}8%{opacity:1}100%{transform:translateY(0) scale(1)}}
@keyframes lbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5vh)}}
@keyframes lspin{0%{transform:rotate(-200deg)}100%{transform:rotate(0)}}
@keyframes lhalo{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-6px);opacity:1}}
@keyframes lshock{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(9)}}
@keyframes lflash{0%{opacity:1}100%{opacity:0}}

/* ===== visitor counter ===== */
#vcount{margin:6px auto 14px;text-align:center;font:500 13px system-ui,-apple-system,sans-serif;opacity:.8;white-space:nowrap;letter-spacing:.1px;color:inherit;text-shadow:none}
#vcount b{font-weight:700}#vcount .vsep{margin:0 8px;opacity:.6}
#vcount[hidden]{display:none}
.th-pixel #vcount{background:rgba(255,255,255,.75);color:#222;width:fit-content;padding:3px 10px;opacity:1}
.th-nature #vcount,.th-slime #vcount,.th-classic #vcount{color:#33415c}
.th-halloween #vcount,.th-zombie #vcount,.th-gothic #vcount{color:#e8e2d0}
/* ===== bottom sub row: feedback + coffee ===== */
.asub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.asub a.coffee,.asub .fbpill{margin:0!important;width:100%!important;min-height:42px;padding:8px 6px!important;font:700 14px system-ui,-apple-system,sans-serif!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:999px!important;box-sizing:border-box;display:flex!important;align-items:center;justify-content:center;letter-spacing:0}
.asub .fbpill{background:linear-gradient(135deg,#fff8d6,#ffe89a)!important;color:#4a3500!important;border:1.5px solid #e0b25a!important;box-shadow:0 2px 6px rgba(60,40,0,.2)!important;text-shadow:none!important;cursor:pointer}
.th-pixel .asub a.coffee,.th-pixel .asub .fbpill{border-radius:0!important}
@media(max-width:380px){.asub{gap:6px}.asub a.coffee,.asub .fbpill{font-size:12.5px!important;padding:8px 2px!important}}
.fbform label{display:block;font-weight:700;font-size:14px;margin:0 0 10px}
.fbform input:not([type=radio]),.fbform textarea{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px 10px;font:400 16px system-ui,sans-serif;border:1px solid var(--ln);border-radius:10px;background:var(--sb);color:var(--f)}
.fbform textarea{resize:vertical;min-height:110px}
.fbform input:focus,.fbform textarea:focus{outline:2px solid #e0b25a;outline-offset:1px}
.fbform fieldset{border:0;padding:0;margin:0 0 10px}.fbform legend{font-weight:700;font-size:14px;padding:0;margin-bottom:4px}
.fbtypes{display:flex;gap:6px}.fbt{flex:1;margin:0!important}.fbt input{position:absolute;opacity:0;pointer-events:none}
.fbt span{display:block;text-align:center;padding:8px 2px;border:1.5px solid var(--ln);border-radius:999px;font-size:14px;white-space:nowrap;background:var(--sb);cursor:pointer}
.fbt input:checked+span{border-color:#e0b25a;background:linear-gradient(135deg,#fff3b0,#ffd23f);color:#3d2c00}
.fbt input:focus-visible+span{outline:2px solid #e0b25a}
.fbcount{display:block;text-align:right;font-weight:400;opacity:.7;font-size:12px;margin-top:2px}
.fbintro{margin:0 0 10px;font-size:14px;opacity:.9}
.fbhp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;opacity:0!important}
.fbbtns{display:flex;gap:8px;justify-content:flex-end}.fbbtns button{margin:0!important;min-width:100px}
.fbbtns #fbs[disabled]{opacity:.6;cursor:wait}
/* ===== coffee ===== */
a.coffee{display:flex!important;align-items:center;justify-content:center;margin:10px auto 0!important;width:fit-content;max-width:100%;min-height:40px;padding:8px 22px!important;box-sizing:border-box;border-radius:999px!important;background:linear-gradient(135deg,#7a4b2a,#a8703f)!important;color:#fff6e0!important;border:1.5px solid #e0b25a!important;box-shadow:0 2px 6px rgba(60,30,10,.35)!important;font:700 15px system-ui,-apple-system,sans-serif!important;text-decoration:none!important;white-space:nowrap;letter-spacing:.2px;text-shadow:0 1px 1px rgba(0,0,0,.35)!important}
a.coffee:hover{filter:brightness(1.08)}a.coffee:active{transform:translateY(1px)}
a.coffee.wcof{margin-top:12px!important;font-size:14px!important;min-height:36px;padding:6px 18px!important}
.th-pixel a.coffee{border-radius:0!important;font-size:11px!important}

<script>(function(root){
const CATS=[
 ['u1','Jedynki (1)'],['u2','Dwójki (2)'],['u3','Trójki (3)'],['u4','Czwórki (4)'],['u5','Piątki (5)'],['u6','Szóstki (6)'],
 ['para','Para'],['dpary','Dwie pary'],['tpary','Trzy pary'],['trojka','Trójka'],['dtrojki','Dwie trójki'],
 ['mstrit','Mały strit 1-5'],['dstrit','Duży strit 2-6'],['lstrit','Długi strit 1-6'],['general','Generał'],
 ['full','Full'],['kareta','Kareta'],['poker','Poker (5 jednakowych)'],['lord','Lord (6 jednakowych)'],['szansa','Szansa']];
const UPPER=CATS.slice(0,6).map(c=>c[0]);
// rows removed per dice-count variant (single config)
const REMOVED={5:['lord','tpary','lstrit','dtrojki'],6:[]};
function ndOf(g){return g&&g.nd===5?5:6}
function catsFor(nd){const r=REMOVED[nd===5?5:6]||[];return CATS.filter(c=>!r.includes(c[0]))}
function counts(d){const c=[0,0,0,0,0,0,0];d.forEach(v=>c[v]++);return c;}
// best (max) score for each category; null = not possible
function scores(d){
 const c=counts(d),s={},sum=d.reduce((a,b)=>a+b,0);
 for(let n=1;n<=6;n++)s['u'+n]=(c[n]-3)*n;
 const pairs=[],trips=[];
 for(let n=6;n>=1;n--){if(c[n]>=2)pairs.push(n);if(c[n]>=3)trips.push(n);}
 s.para=pairs.length?2*pairs[0]:null;
 // pairs from distinct values; a value with 4+ can count as two pairs
 const pv=[];for(let n=6;n>=1;n--){for(let k=0;k<Math.floor(c[n]/2);k++)pv.push(n);}
 s.dpary=pv.length>=2?2*(pv[0]+pv[1]):null;
 s.tpary=pv.length>=3?2*(pv[0]+pv[1]+pv[2]):null;
 s.trojka=trips.length?3*trips[0]:null;
 const tv=[];for(let n=6;n>=1;n--){for(let k=0;k<Math.floor(c[n]/3);k++)tv.push(n);}
 s.dtrojki=tv.length>=2?3*(tv[0]+tv[1]):null;
 const has=a=>a.every(n=>c[n]>=1);
 s.mstrit=has([1,2,3,4,5])?15:null; s.dstrit=has([2,3,4,5,6])?20:null; s.lstrit=has([1,2,3,4,5,6])?21:null;
 let g=null;for(const m of [2,3,4,5]){const need=[1,2,3,4,5,6].filter(x=>x!==m);if(has(need)){const v=21-m;if(g===null||v>g)g=v;}}
 s.general=g;
 let f=null;for(let a=1;a<=6;a++)for(let b=1;b<=6;b++)if(a!==b&&c[a]>=3&&c[b]>=2){const v=3*a+2*b;if(f===null||v>f)f=v;}
 s.full=f;
 let k=null,p=null,l=null;for(let n=1;n<=6;n++){if(c[n]>=4)k=4*n;if(c[n]>=5)p=5*n+50;if(c[n]>=6)l=2*(5*n+50);}
 s.kareta=k;s.poker=p;s.lord=l;s.szansa=sum;
 return s;
}
function finalScore(cat,d,firstRoll){const v=scores(d)[cat];if(v===null)return null;return dbl(cat,firstRoll)?v*2:v;}
function dbl(cat,firstRoll){return !!firstRoll&&cat!=='szansa'&&!UPPER.includes(cat);}
function totals(sheet,nd){
 let up=0;UPPER.forEach(k=>{if(typeof sheet[k]==='number')up+=sheet[k];});
 const upDone=UPPER.every(k=>k in sheet),szkola=(up<0&&upDone)?up-50:up;let low=0;
 CATS.slice(6).forEach(([k])=>{if(typeof sheet[k]==='number')low+=sheet[k];});
 const cats=catsFor(nd===5?5:6),crossed=cats.slice(6).some(([k])=>sheet[k]==='x'),complete=cats.every(([k])=>k in sheet),bonus=crossed?0:(complete?50:null);
 return {upper:up,szkola,lower:low,bonus,total:szkola+low+(bonus||0)};
}
// ---- game state machine (authoritative on host) ----
const MAX_EXTRA=3;
function newGame(names,nd){nd=nd===5?5:6;return {gid:Date.now().toString(36)+Math.random().toString(36).slice(2,7),nd,phase:'play',players:names.map(n=>({name:n,sheet:{},extraUsed:0})),cur:0,dice:Array(nd).fill(0),held:Array(nd).fill(false),rolls:0,round:1,log:[]};}
function canRoll(g){const p=g.players[g.cur];return g.phase==='play'&&(g.rolls<3||(g.rolls>=3&&p.extraUsed<MAX_EXTRA));}
function roll(g,rnd){

 g.dice=g.dice.map((v,i)=>g.held[i]&&g.rolls>0?v:1+Math.floor(rnd()*6));g.rolls++;return true;}
function toggleHold(g,i){if(g.rolls>0)g.held[i]=!g.held[i];}
function write(g,cat,cross){

const api={REMOVED,catsFor,ndOf,done,leave,dbl,CAT_EN,CATS,UPPER,scores,finalScore,totals,newGame,canRoll,roll,toggleHold,write,MAX_EXTRA};

})(this);

 h+=sec(3,'<p>'+r.up+'</p><div class="grid">'+r.upex.map(([d,n,v])=>'<div class="ex">'+miniDice(d,d.map((x,i)=>i).filter(i=>d[i]==({Czwórki:4,Fours:4,Trójki:3,Threes:3,Szóstki:6,Sixes:6,Dwójki:2,Twos:2}[n]||5)))+'<span>'+n+': <b class="'+(v[0]=='−'?'neg':'')+'">'+v+'</b></span></div>').join('')+'</div><p class="note">'+r.upsum+'</p>');
 h+=sec(4,'<p>'+r.low+'</p><div class="cards">'+RX.map(([k,d,on])=>{const v=K.scores(d)[k];return '<div class="rc"><div class="rct">'+catName(k)+'</div><div class="rcn">'+r.need[k]+'</div>'+miniDice(d,on)+'<div class="rcs">'+r.how[k]+' → <b>'+v+'</b>'+(k!=='szansa'?' <span class="small">('+r.dblw+' '+v*2+')</span>':'')+'</div></div>'}).join('')+'</div><p class="note">'+r.lowNote+'</p>');
 h+=sec(5,'<p>'+r.cross+'</p>');

 h+=sec(7,'<ul>'+r.end.map(x=>'<li>'+x+'</li>').join('')+'</ul>');

 h+=sec(9,'<ul>'+r.hs.map(x=>'<li>'+x+'</li>').join('')+'</ul>');

// ---- high scores (global via retained MQTT + local fallback) ----
const HS_V1='kosci-online/highscores/v1',HS_T={5:'kosci-online/highscores/v2/d5',6:'kosci-online/highscores/v2/d6'};
let HS=[],hsCli=null,hsGot=false,hsPending=[],HSTAB=0;const GOT={5:false,6:false},REM={5:'',6:''};
function hsClean(n){return String(n||'').replace(/[<>&"'`\u0000-\u001f]/g,'').trim().slice(0,20)||'?'}
function hsValid(e){return e&&typeof e.g==='string'&&e.g.length<40&&typeof e.s==='number'&&isFinite(e.s)&&Math.abs(e.s)<5000&&typeof e.d==='number'}
function hsMerge(a,b){const m={};[...a,...b].filter(hsValid).forEach(e=>{e={g:e.g.slice(0,40),n:hsClean(e.n),s:Math.round(e.s),d:e.d,k:e.k===5?5:6};const key=e.g+'|'+e.n,o=m[key];if(!o||e.s>o.s||(e.s===o.s&&(e.d<o.d||(e.d===o.d&&e.k<o.k))))m[key]=e});
 const all=Object.values(m).sort((x,y)=>y.s-x.s||x.d-y.d);return [5,6].flatMap(k=>all.filter(e=>e.k===k).slice(0,10))}
function hsBoard(k){return HS.filter(e=>e.k===k)}
try{HS=hsMerge(JSON.parse(localStorage.khs||'[]'),[])}catch(e){HS=[]}
function hsSave(){localStorage.khs=JSON.stringify(HS);if(!$('rov').hidden&&$('rov').dataset.hs)openHS()}
let hsPubN=0,hsPubT=0;function hsPublish(){if(!hsCli||!hsCli.connected)return;const nw=Date.now();if(nw-hsPubT>60000){hsPubT=nw;hsPubN=0}if(++hsPubN>20)return;[5,6].forEach(k=>{const b=hsBoard(k),j=JSON.stringify(b);if(GOT[k]&&b.length&&j!==REM[k]){REM[k]=j;hsCli.publish(HS_T[k],j,{qos:1,retain:true})}})}
function hsConnect(i){i=i||0;const [u,o]=SERVERS[i%SERVERS.length];let ok=false;
 try{hsCli=mqtt.connect(u,Object.assign({connectTimeout:15000,reconnectPeriod:5000,clientId:'h'+Math.random().toString(16).slice(2,10)},o))}catch(e){return}
 const fail=setTimeout(()=>{if(!ok){hsCli.end(true);if(i<SERVERS.length*2)hsConnect(i+1)}},17000);
 hsCli.on('connect',()=>{ok=true;clearTimeout(fail);hsGot=false;GOT[5]=GOT[6]=false;REM[5]=REM[6]='';
  hsCli.subscribe([HS_V1,HS_T[5],HS_T[6]],{qos:1},()=>{setTimeout(()=>{GOT[5]=GOT[6]=true;hsGot=true;hsSync()},6000)})});
 hsCli.on('message',(tp,m)=>{let d=[];try{d=JSON.parse(m.toString())}catch(e){}if(!Array.isArray(d))d=[];
  let k=0;if(tp===HS_T[5])k=5;else if(tp===HS_T[6])k=6;else if(tp!==HS_V1)return;
  if(k){d=d.map(e=>Object.assign({},e,{k}));REM[k]=JSON.stringify(hsMerge(d,[]).filter(e=>e.k===k));GOT[k]=true;hsGot=true}
  HS=hsMerge(d,HS.concat(hsPending.splice(0)));hsSave();hsPublish()});}
function hsSync(){HS=hsMerge(HS,hsPending.splice(0));hsSave();hsPublish();gsFlush()}
const hsDone={};
// ---- game snapshots (retained kosci-online/games/v1/<gid>, fetched on demand) ----
const GS_T='kosci-online/games/v1/';let gsQ=[],gsN=0,gsT=0;
function gsId(g){return String(g||'').replace(/[^A-Za-z0-9_-]/g,'_').slice(0,60)}
function gsLoadAll(){try{const o=JSON.parse(localStorage.kgs||'{}');return o&&typeof o==='object'&&!Array.isArray(o)?o:{}}catch(e){return {}}}
function gsSan(x){if(!x||typeof x!=='object'||typeof x.g!=='string'||!Array.isArray(x.p)||!x.p.length||x.p.length>8)return null;const k=x.k===5?5:6,cats=K.catsFor(k).map(c=>c[0]);
 const okv=v=>v==='x'||(typeof v==='number'&&isFinite(v)&&Math.abs(v)<1000);
 const p=x.p.map(q=>{const sh={};if(q&&q.s&&typeof q.s==='object')cats.forEach(c=>{if(c in q.s&&okv(q.s[c]))sh[c]=typeof q.s[c]==='number'?Math.round(q.s[c]):'x'});return {n:hsClean(q&&q.n),s:sh}});
 const m=Array.isArray(x.m)?x.m.filter(e=>Array.isArray(e)&&Number.isInteger(e[0])&&e[0]>=0&&e[0]<p.length&&cats.includes(e[1])&&okv(e[2])).slice(0,200).map(e=>[e[0],e[1],e[2],e[3]?1:0]):[];
 return {v:1,g:x.g.slice(0,40),d:typeof x.d==='number'?x.d:0,k,p,m}}
function gsMake(g,gid,d){let o={v:1,g:gid,d,k:K.ndOf(g),p:g.players.map(q=>({n:hsClean(q.name),s:q.sheet})),m:(g.mv||[]).slice(0,200)};if(JSON.stringify(o).length>16000)o.m=[];return gsSan(o)}
function gsStore(o){if(!o)return;const all=gsLoadAll();all[gsId(o.g)]=o;const ks=Object.keys(all);ks.sort((a,b)=>(all[a].d||0)-(all[b].d||0));while(ks.length>30)delete all[ks.shift()];try{localStorage.kgs=JSON.stringify(all)}catch(e){}}
function gsFlush(){if(!hsCli||!hsCli.connected||!hsGot)return;const nw=Date.now();if(nw-gsT>60000){gsT=nw;gsN=0}
 while(gsQ.length&&gsN<5){const o=gsQ.shift();gsN++;hsCli.publish(GS_T+gsId(o.g),JSON.stringify(o),{qos:1,retain:true})}}
function gsFetch(gid,cb){const id=gsId(gid),loc=gsLoadAll()[id];if(loc)return cb(loc);if(!hsCli||!hsCli.connected)return cb(null);
 const tp=GS_T+id;let fin=false;const h=(t2,m)=>{if(t2!==tp||fin)return;let o=null;try{o=gsSan(JSON.parse(m.toString()))}catch(e){}if(!o||gsId(o.g)!==id)return;done(o)};
 const done=o=>{if(fin)return;fin=true;clearTimeout(to);hsCli.removeListener('message',h);try{hsCli.unsubscribe(tp)}catch(e){}if(o)gsStore(o);cb(o)};
 const to=setTimeout(()=>done(null),6000);hsCli.on('message',h);hsCli.subscribe(tp,{qos:1})}
function hsSubmit(g){if(!g||g.phase!=='end')return;if(!g.players.length||g.players.some(p=>p.left||!K.done(p,K.ndOf(g))))return;
 const gid=g.gid||(ROOM+'-'+g.players.map(p=>p.name).join(','));if(hsDone[gid])return;hsDone[gid]=1;const d=Date.now();
 const add=g.players.map(p=>({g:gid,n:hsClean(p.name),s:K.totals(p.sheet,K.ndOf(g)).total,d,k:K.ndOf(g)}));
 HS=hsMerge(HS,add);if(!hsGot)hsPending.push(...add);hsSave();hsPublish();
 try{const o=gsMake(g,gid,d);if(o){gsStore(o);gsQ.push(o);gsFlush()}}catch(e){}}
function hsDate(ms){const x=new Date(ms);return String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0')+'.'+x.getFullYear()}

function openHS(){const o=$('rov');o.dataset.hs=1;const md=[hsCup('#ffcf33','#a87800'),hsCup('#d9dde3','#7d8590'),hsCup('#d98b4a','#8a4f1d')];
 if(!HSTAB)HSTAB=G?K.ndOf(G):(localStorage.klastnd==='5'?5:6);const B=hsBoard(HSTAB);

 if(!B.length)h+='<p class="hsempty">'+t('hsEmpty')+'</p>';else h+='<table class="hst"><thead><tr><th>#</th><th>'+t('hsName')+'</th><th>'+t('hsDate')+'</th><th>'+t('hsScore')+'</th></tr></thead><tbody>'+B.map((e,i)=>'<tr class="r'+(i+1)+'"><td>'+(md[i]||i+1)+'</td><td>'+e.n+'</td><td>'+hsDate(e.d)+'</td><td><b>'+e.s+'</b><button class="hsdet" data-i="'+i+'" aria-label="'+t('gdBtn')+'" title="'+t('gdBtn')+'">📋</button></td></tr>').join('')+'</tbody></table>';
 o.innerHTML=h+'<p class="small hsst">'+(hsGot?'🟢 online':'🟠 offline – local')+'</p></div>';o.hidden=false;document.body.style.overflow='hidden';
 o.querySelectorAll('.hstab').forEach(b=>b.onclick=()=>{HSTAB=+b.dataset.k;openHS()});o.querySelectorAll('.hsdet').forEach(b=>b.onclick=()=>openGD(B[+b.dataset.i]));$('rclose').onclick=()=>{delete o.dataset.hs;HSTAB=0;closeRules()}}

function openGD(e){if(!e)return;const o=$('gdv');o.className='gt-'+sset();
 const shell=b=>'<div class="gdcard" role="dialog" aria-modal="true"><div class="gdhead"><b>📋 '+t('gdT')+'</b><button id="gdx" aria-label="close">✕</button></div><div class="gdbody">'+b+'</div></div>';

function gdHTML(x,e){const nd=x.k,cats=K.catsFor(nd),T=x.p.map(q=>K.totals(q.s,nd)),best=Math.max(...T.map(z=>z.total));
 const dbl={};x.m.forEach(m=>{if(m[3])dbl[m[0]+'|'+m[1]]=1});const hi=x.p.findIndex(q=>q.n===e.n);
 const cc=i=>(T[i].total===best?' gwin':'')+(i===hi?' ghs':'');
 let h='<p class="gdmeta">📅 '+hsDate(x.d||e.d)+' · 🎲 '+nd+' '+t('gdDice')+' · 👥 '+x.p.length+'</p><div class="gdscroll"><table class="gdt"><thead><tr><th>'+t('cat')+'</th>'+x.p.map((q,i)=>'<th class="'+cc(i)+'">'+(T[i].total===best?'👑 ':'')+(i===hi?'⭐ ':'')+q.n+'</th>').join('')+'</tr></thead><tbody>';
 const row=(k,ci)=>'<tr><td>'+catName(k)+'</td>'+x.p.map((q,i)=>{const v=q.s[k];let c='',txt='';
   if(v===undefined)txt='';else if(v==='x'){c='gx';txt='✕'}else if(ci<6&&v===0){c='gz';txt='x'}else{txt=v;c=v<0?'gneg':''}
   if((k==='poker'||k==='lord')&&typeof v==='number')c+=' ggold';
   return '<td class="'+c+cc(i)+'">'+txt+(dbl[i+'|'+k]?'<sup>×2</sup>':'')+'</td>'}).join('')+'</tr>';
 cats.slice(0,6).forEach(([k],ci)=>h+=row(k,ci));
 h+='<tr class="gsum"><td>'+t('school')+'</td>'+T.map((z,i)=>'<td class="'+(z.szkola<0?'gneg':'')+cc(i)+'">'+z.szkola+'</td>').join('')+'</tr>';
 cats.slice(6).forEach(([k])=>h+=row(k,6));
 h+='<tr class="gsum"><td>'+t('lower')+'</td>'+T.map((z,i)=>'<td class="'+cc(i)+'">'+z.lower+'</td>').join('')+'</tr>';
